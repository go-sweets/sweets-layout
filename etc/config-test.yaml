# Test Environment Configuration
server:
  http_port: 8081
  rpc_port: 9091
  mode: test
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  max_conns: 500
  debug: false

database:
  driver: mysql
  dsn: ${DB_DSN:root:testpasswd@tcp(127.0.0.1:33061)/test_db?charset=utf8mb4&parseTime=True&loc=Local}
  auto_migrate: true
  max_open_conns: 5
  max_idle_conns: 2
  conn_max_lifetime: 180s
  log_level: warn

redis:
  addr: ${REDIS_ADDR:127.0.0.1:6380}
  password: ${REDIS_PASSWORD:}
  db: ${REDIS_DB:1}
  pool_size: 5
  min_idle_conns: 2
  dial_timeout: 3s
  read_timeout: 2s
  write_timeout: 2s

log:
  level: info
  format: json
  output: stdout
  max_size: 50
  max_age: 3
  max_backups: 5
  compress: true

cache:
  default_expiration: 180s
  cleanup_interval: 300s
  redis_cluster: false

monitoring:
  enable_metrics: true
  enable_tracing: true
  enable_profiling: false
  metrics_port: 9092
  
feature_flags:
  enable_cache: true
  enable_compression: true
  enable_rate_limiting: true
  enable_circuit_breaker: true
